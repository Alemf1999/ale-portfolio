    <!-- ============================================
         FILTROS
         Para añadir una categoría nueva:
         1. Añade un botón aquí con un data-filter nuevo (sin acentos ni espacios)
         2. Usa ese mismo valor en el data-category de las tarjetas de abajo
         ============================================ -->

    <!-- ============================================
         REJILLA DE PROYECTOS
         Para añadir un proyecto nuevo:
         1. Copia una tarjeta <button class="work-card">...</button>
         2. Cambia data-project por un id único (sin espacios)
         3. Cambia data-category por una de las categorías de arriba
         4. Cambia la imagen (assets/images/proj-X-thumb.jpg) y el texto
        5. El título y la técnica/año que aparecen aquí se reutilizan
          automáticamente en el detalle al pulsar la tarjeta.
        6. Añade la descripción y las fotos en js/script.js, usando el
          mismo id que pusiste en data-project.
         Si la imagen no existe todavía, se muestra un color de fondo
         en su lugar, así que puedes montar la web antes de tener las fotos.
         ============================================ -->
